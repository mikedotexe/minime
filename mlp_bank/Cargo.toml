[package]
name = "mlp-bank"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["full"] }
warp = "0.3"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
