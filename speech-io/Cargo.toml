[package]
name = "speech-io"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.39", features = ["full"] }
tokio-tungstenite = "0.21"
tungstenite = "0.21"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
cpal = "0.15"
whisper-rs = "0.15"
rodio = { version = "0.18", default-features = true }
bytes = "1.6"
base64 = "0.22"
crossbeam-channel = "0.5"
num_cpus = "1.16"
