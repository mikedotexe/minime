[package]
name = "minime"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
astrid-minime-protocol = { git = "https://github.com/mikedotexe/astrid.git", rev = "c6ecb853d1a9bc7a7479d37d8366553a0bae0bc5" }
metal = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "signal"] }
tokio-tungstenite = "0.21"
futures = "0.3"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
fastrand = "2"
rand = { version = "0.8", features = ["small_rng"] }
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
