[package]
name = "metal_consciousness"
version = "0.1.0"
edition = "2021"

[lib]
name = "metal_consciousness"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core dependencies
anyhow = "1.0"
metal = "0.29"
objc = "0.2"
fastrand = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Linear algebra
nalgebra = "0.32"
ndarray = "0.15"

# Python bindings (optional for examples)
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"], optional = true }
numpy = { version = "0.20", optional = true }

# Async runtime for background processing
tokio = { version = "1.35", features = ["full"] }

# Random number generation
rand = "0.8"

[build-dependencies]
pyo3-build-config = "0.20"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[features]
default = ["python"]
python = ["pyo3", "numpy", "pyo3/extension-module"]